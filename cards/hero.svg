<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" role="img"><style>:root{--ink:#1f2328;--muted:#656d76;--line:#d0d7de;--card:#f6f8fa;--blue:#0969da;--red:#cf222e;--yel:#bf8700;--h0:#ebedf0;--h1:#b6d6ff;--h2:#79b8ff;--h3:#388bfd;--h4:#0969da}@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#7d8590;--line:#30363d;--card:#161b22;--blue:#58a6ff;--red:#ff7b72;--yel:#e3b341;--h0:#161b22;--h1:#0c2d6b;--h2:#1158c7;--h3:#388bfd;--h4:#79c0ff}}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .l{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
    .r{opacity:0;animation:fade .25s ease forwards}@keyframes fade{to{opacity:1}}
    .dot{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style>
