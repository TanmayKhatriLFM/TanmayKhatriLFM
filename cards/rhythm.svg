<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img"><style>:root{--ink:#1f2328;--muted:#656d76;--line:#d0d7de;--card:#f6f8fa;--floor:#e3e7eb;--b1:#6f95ff;--b2:#2f5bea;--b3:#1e3fb0;--hi:#e5484d}@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#7d8590;--line:#30363d;--card:#161b22;--floor:#1d242d;--b1:#8fb0ff;--b2:#4a78f0;--b3:#2a4fc2;--hi:#ff7b72}}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
