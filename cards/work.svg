<svg xmlns="http://www.w3.org/2000/svg" width="260" height="180" viewBox="0 0 260 180" role="img"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .t{transform-box:fill-box;transform-origin:bottom left;opacity:0;animation:swing 1s cubic-bezier(.3,1.5,.5,1) 0.45s forwards}
    @keyframes swing{from{opacity:0;transform:translateY(46px) rotate(4deg)}to{opacity:1;transform:none}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out 1.45s infinite;opacity:0}
    @keyframes ring{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .ar{animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{50%{transform:translate(4px,-4px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="260" height="180" rx="16" fill="#f4efe4" stroke="#d8d0bd"/><defs><linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="-120" x2="-40">
