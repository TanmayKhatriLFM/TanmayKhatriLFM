<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.9,.2,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
    .pop{opacity:0;animation:pp .4s ease forwards}@keyframes pp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="820" height="300" rx="16" fill="#f4efe4" stroke="#d8d0bd"/><text class="serif" x="36" y="50" font-size="30" fill="#17150f">Activity</text><text class="m" x="36" y="70" font-size="12" fill="#6b6558">commits and contributions per month since joining</text><g class="pop" style="animation-delay:0.20s"><text class="serif" x="470" y="52" font-size="36" fill="#17150f">16</text><text x="470" y="70" font-size="11" fill="#6b6558">contributions</text></g><g class="pop" style="animation-delay:0.32s"><text class="serif" x="558" y="52" font-size="36" fill="#17150f">8</text><text x="558" y="70" font-size="11" fill="#6b6558">active days</text></g><g class="pop" style="animation-delay:0.44s"><text class="serif" x="646" y="52" font-size="36" fill="#17150f">4</text><text x="646" y="70" font-size="11" fill="#6b6558">day streak</text></g><g class="pop" style="animation-delay:0.56s"><text class="serif" x="734" y="52" font-size="36" fill="#17150f">3</text><text x="734" y="70" font-size="11" fill="#6b6558">busiest day</text></g><rect class="b" style="animation-delay:0.00s" x="46.0" y="167.0" width="86.9" height="33.0" rx="6" fill="#17150f" opacity="1"/><text x="89.4" y="222" text-anchor="middle" font-size="12" fill="#6b6558">May</text><text class="pop" style="animation-delay:0.80s" x="89.4" y="159.0" text-anchor="middle" font-size="14" font-weight="700" fill="#17150f">3</text><rect class="b" style="animation-delay:0.10s" x="152.9" y="90.0" width="86.9" height="110.0" rx="6" fill="#2f5bea" opacity="1"/><text x="196.3" y="222" text-anchor="middle" font-size="12" fill="#6b6558">Jun</text><text class="pop" style="animation-delay:0.90s" x="196.3" y="82.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2f5bea">10</text>