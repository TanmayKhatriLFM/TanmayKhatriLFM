<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" role="img"><style>:root{--ink:#1f2328;--muted:#656d76;--line:#d0d7de;--card:#f6f8fa;--blue:#0969da;--red:#cf222e;--yel:#bf8700;--h0:#ebedf0;--h1:#b6d6ff;--h2:#79b8ff;--h3:#388bfd;--h4:#0969da}@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#7d8590;--line:#30363d;--card:#161b22;--blue:#58a6ff;--red:#ff7b72;--yel:#e3b341;--h0:#161b22;--h1:#0c2d6b;--h2:#1158c7;--h3:#388bfd;--h4:#79c0ff}}text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.9,.2,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
    .pop{opacity:0;animation:pp .4s ease forwards}@keyframes pp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}</style><text class="serif" x="36" y="50" font-size="30" fill="var(--ink)">Activity</text><text class="m" x="36" y="70" font-size="12" fill="var(--muted)">commits and contributions per month since joining</text><g class="pop" style="animation-delay:0.20s"><text class="serif" x="470" y="52" font-size="36" fill="var(--ink)">16</text><text x="470" y="70" font-size="11" fill="var(--muted)">contributions</text></g><g class="pop" style="animation-delay:0.32s"><text class="serif" x="558" y="52" font-size="36" fill="var(--ink)">8</text><text x="558" y="70" font-size="11" fill="var(--muted)">active days</text></g><g class="pop" style="animation-delay:0.44s"><text class="serif" x="646" y="52" font-size="36" fill="var(--ink)">4</text><text x="646" y="70" font-size="11" fill="var(--muted)">day streak</text></g><g class="pop" style="animation-delay:0.56s"><text class="serif" x="734" y="52" font-size="36" fill="var(--ink)">3</text><text x="734" y="70" font-size="11" fill="var(--muted)">busiest day</text></g><rect class="b" style="animation-delay:0.00s" x="46.0" y="167.0" width="86.9" height="33.0" rx="6" fill="var(--ink)" opacity="1"/><text x="89.4" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">May</text><text class="pop" style="animation-delay:0.80s" x="89.4" y="159.0" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">3</text><rect class="b" style="animation-delay:0.10s" x="152.9" y="90.0" width="86.9" height="110.0" rx="6" fill="var(--blue)" opacity="1"/><text x="196.3" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">Jun</text><text class="pop" style="animation-delay:0.90s" x="196.3" y="82.0" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)">10</text><rect class="b" style="animation-delay:0.20s" x="259.7" y="196.0" width="86.9" height="4.0" rx="6" fill="var(--line)" opacity="0.8"/><text x="303.1" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">Jul</text><rect class="b" style="animation-delay:0.30s" x="366.6" y="196.0" width="86.9" height="4.0" rx="6" fill="var(--line)" opacity="0.8"/><text x="410.0" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">Aug</text><rect class="b" style="animation-delay:0.40s" x="473.4" y="196.0" width="86.9" height="4.0" rx="6" fill="var(--line)" opacity="0.8"/><text x="516.9" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">Sep</text><rect class="b" style="animation-delay:0.50s" x="580.3" y="196.0" width="86.9" height="4.0" rx="6" fill="var(--line)" opacity="0.8"/><text x="623.7" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">Oct</text><rect class="b" style="animation-delay:0.60s" x="687.1" y="167.0" width="86.9" height="33.0" rx="6" fill="var(--ink)" opacity="1"/><text x="730.6" y="222" text-anchor="middle" font-size="12" fill="var(--muted)">Nov</text><text class="pop" style="animation-delay:1.40s" x="730.6" y="159.0" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">3</text><text class="m" x="36" y="282" font-size="11" fill="var(--muted)">busiest day: 29 May 2026</text></svg>